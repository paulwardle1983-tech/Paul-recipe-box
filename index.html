<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f8f3b">
<title>Paul's Recipe Box</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#17211b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:24px;font-weight:800}.sub{color:#68736b;font-size:13px}.search{width:100%;padding:14px 16px;border:1px solid #e1e7e1;border-radius:16px;font-size:16px;background:white;margin:14px 0}
button{font:inherit}.btn{border:0;background:#2f8f3b;color:#fff;padding:11px 15px;border-radius:12px;font-weight:700;cursor:pointer}.btn.secondary{background:#eaf1ea;color:#245b2b}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{border:0;background:#e8f3e9;color:#246d2d;border-radius:999px;padding:9px 13px;white-space:nowrap;cursor:pointer}
.hero{background:linear-gradient(135deg,#dff1df,#f8fbf7);border-radius:22px;padding:20px;margin:12px 0 20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#68736b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #e1e7e1;border-radius:18px;padding:16px;box-shadow:0 3px 12px #1a2b1a0b}
.card h3{margin:0 0 7px}.meta{color:#68736b;font-size:13px}.tag{display:inline-block;background:#edf6ee;color:#2d7835;padding:5px 8px;border-radius:8px;font-size:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section{margin:20px 0 10px}.empty{padding:30px;text-align:center;color:#68736b}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:min(900px,100%);border-radius:24px 24px 0 0;padding:22px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
.form input,.form textarea{width:100%;padding:12px;border:1px solid #e1e7e1;border-radius:12px;margin:6px 0 12px;font:inherit}.form textarea{min-height:120px}.footer{text-align:center;color:#68736b;padding:30px 0 10px;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">🌿 Paul's Recipe Box</div><div class="sub">Good food. A happier you.</div></div>
    <button id="addBtn" class="btn">＋ Add</button>
  </div>

  <input id="search" class="search" placeholder="🔎 Search recipes or ingredients…">

  <div class="chips" id="chips">
    <button class="chip" data-cat="All">All</button>
    <button class="chip" data-cat="Quick">Quick Meals</button>
    <button class="chip" data-cat="Curry">Curries</button>
    <button class="chip" data-cat="Fakeaway">Fakeaways</button>
    <button class="chip" data-cat="Breakfast">Breakfast</button>
    <button class="chip" data-cat="Christmas">Christmas</button>
  </div>

  <div class="hero">
    <h2>What can I make?</h2><p>Enter ingredients you have and we'll find matching recipes.</p>
    <input id="have" class="search" style="margin:13px 0 0" placeholder="e.g. tofu, mushrooms, peppers">
    <div id="matches"></div>
  </div>

  <div class="row section"><h2 style="margin:0">Your recipes</h2><span id="count" class="meta"></span></div>
  <div id="recipes" class="grid"></div>
  <div class="footer">V1 • Recipes are saved on this device</div>
</div>

<div id="modal" class="modal">
  <div class="sheet">
    <button id="closeBtn" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
"use strict";
const starterRecipes=[
{name:"Tofu Stir Fry",cat:"Quick",time:20,serves:2,vegan:true,ingredients:["200g firm tofu","1 red pepper","250g mushrooms","150g noodles","2 spring onions","1 tbsp soy sauce","1 tbsp sesame oil"],method:["Press and cube the tofu.","Fry tofu until golden.","Add peppers and mushrooms and cook until softened.","Add noodles, soy sauce and sesame oil. Toss together and serve."]},
{name:"Lentil Curry",cat:"Curry",time:35,serves:4,vegan:true,ingredients:["200g red lentils","1 onion","2 garlic cloves","400ml chopped tomatoes","400ml coconut milk","2 tsp curry powder"],method:["Soften onion and garlic.","Add curry powder and cook for 1 minute.","Add lentils, tomatoes and coconut milk.","Simmer until thick and the lentils are tender."]},
{name:"Overnight Oats",cat:"Breakfast",time:5,serves:1,vegan:true,ingredients:["50g oats","150ml oat milk","1 tbsp peanut butter","1 tbsp maple syrup","Berries"],method:["Mix oats, oat milk, peanut butter and maple syrup.","Chill overnight.","Top with berries before eating."]}
];

let recipes=[];
let cat="All";
try{const saved=JSON.parse(localStorage.getItem("prb-recipes"));recipes=Array.isArray(saved)&&saved.length?saved:structuredClone(starterRecipes)}catch(e){recipes=structuredClone(starterRecipes)}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("prb-recipes",JSON.stringify(recipes))}catch(e){}}
function openModal(content){$("modalContent").innerHTML=content;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}

function viewRecipe(i){
 const r=recipes[i]; if(!r)return;
 openModal(`<h1>${esc(r.name)}</h1><div class="meta">⏱ ${r.time} mins · 👥 ${r.serves} · ${r.vegan?"🌿 Vegan":""}</div>
 <h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
 <h3>Method</h3><ol>${r.method.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
 <button class="btn" data-action="close">Done</button>`);
}
function openAdd(){
 openModal(`<h2>Add a recipe</h2><div class="form">
 <label>Name</label><input id="n">
 <label>Category</label><input id="c" placeholder="Quick, Curry, Breakfast…">
 <label>Time (minutes)</label><input id="t" type="number" value="30">
 <label>Servings</label><input id="s" type="number" value="2">
 <label>Ingredients (one per line)</label><textarea id="ing"></textarea>
 <label>Method (one step per line)</label><textarea id="met"></textarea>
 <button class="btn" data-action="saveRecipe">Save recipe</button></div>`);
 $("n").focus();
}
function addRecipe(){
 const r={name:$("n").value.trim()||"Untitled recipe",cat:$("c").value.trim()||"Other",time:Number($("t").value)||30,serves:Number($("s").value)||2,vegan:true,
 ingredients:$("ing").value.split("\n").map(x=>x.trim()).filter(Boolean),
 method:$("met").value.split("\n").map(x=>x.trim()).filter(Boolean)};
 recipes.unshift(r);save();closeModal();render();
}
function render(){
 const q=$("search").value.toLowerCase().trim();
 const list=recipes.filter(r=>(cat==="All"||r.cat===cat)&&(!q||(r.name+" "+r.ingredients.join(" ")).toLowerCase().includes(q)));
 $("count").textContent=list.length+" recipe"+(list.length===1?"":"s");
 $("recipes").innerHTML=list.length?list.map(r=>{const i=recipes.indexOf(r);return `<div class="card"><h3>${esc(r.name)}</h3><div class="meta">⏱ ${r.time} mins · 👥 ${r.serves} · ${r.vegan?"🌿 Vegan":""}</div><span class="tag">${esc(r.cat)}</span><div style="margin-top:14px"><button class="btn secondary" data-action="view" data-index="${i}">View recipe</button></div></div>`}).join(""):'<div class="empty">No recipes found.</div>';
}
function renderMatches(){
 const q=$("have").value.toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
 if(!q.length){$("matches").innerHTML="";return}
 const list=recipes.map(r=>({r,score:q.filter(x=>(r.name+" "+r.ingredients.join(" ")).toLowerCase().includes(x)).length})).filter(x=>x.score).sort((a,b)=>b.score-a.score);
 $("matches").innerHTML=list.length?list.slice(0,4).map(x=>`<div class="card" style="margin-top:8px;padding:12px"><b>${esc(x.r.name)}</b><span class="meta"> — matches ${x.score}/${q.length}</span> <button class="btn secondary" data-action="view" data-index="${recipes.indexOf(x.r)}" style="float:right;padding:7px 10px">Open</button></div>`).join(""):'<div class="meta" style="padding-top:10px">Nothing matching yet — try another ingredient.</div>';
}

$("addBtn").addEventListener("click",openAdd);
$("closeBtn").addEventListener("click",closeModal);
$("search").addEventListener("input",render);
$("have").addEventListener("input",renderMatches);
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){cat=b.dataset.cat;render()}});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]"); if(!b)return;
 if(b.dataset.action==="view")viewRecipe(Number(b.dataset.index));
 if(b.dataset.action==="saveRecipe")addRecipe();
 if(b.dataset.action==="close")closeModal();
});
render();
</script>
</body>
</html>
